name: CI

# Every pull request (a new block in library/blocks, or code): build the catalogue, run the tests, build the app.
on:
  pull_request:
    branches: [main]
  # the deploy workflow runs the fast checks (unit, types, translations, examples, build) before it publishes, without
  # the browser tests: with software WebGL a guide step takes minutes there and times out now and then, which would hold
  # back every deploy. They still run on every pull request.
  workflow_call:
    inputs:
      e2e:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check:freshness compares the backlog's commit with main and lists merged branches

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the block catalogue
        run: node tools/build-catalog.mjs

      - name: Example bandos match their script
        # tools/examples/build-examples.ts rebuilds them from the map data and survey in tools/examples/data; a change to
        # the generator, a block or the script that is not rebuilt shows up here
        run: npm run examples && git diff --exit-code -- library/bandos public/library

      - name: Element and impact map match the code
        # tools/build-element-map.mjs writes docs/agents/element-map.md from .harness.json, the templates and the tour (F-032)
        run: node tools/build-element-map.mjs && git diff --exit-code -- docs/agents/element-map.md

      - name: Test
        run: npx ng test --watch=false

      - name: Race relay integration
        run: npm run test:race-relay

      - name: Every UI text has its Italian
        run: npm run check:i18n

      - name: Backlog records and layout
        run: npm run check:backlog

      - name: Harness template, for the release check below
        # check-harness compares this project with the template's release tags; the template is public, so no token.
        run: |
          repo=$(node -p "require('./.harness.json').template?.repo ?? ''")
          if [ -n "$repo" ]; then
            git clone --quiet "$repo" "$RUNNER_TEMP/project-harness" ||
              echo "::warning title=Harness template::Could not clone $repo: template release check skipped."
          fi

      - name: Backlog freshness and template release (warnings only, never blocks)
        env:
          HARNESS_HOME: ${{ runner.temp }}/project-harness
        run: npm run check:freshness -- --github

      - name: Shared surface text contrast
        run: npm run check:contrast

      - name: AGENTS conventions and unused exports
        run: npm run check:conventions

      - name: Type check
        run: npx tsc -p tsconfig.app.json --noEmit --noUnusedLocals --noUnusedParameters && npx tsc -p tools/examples/tsconfig.json && npx tsc -p tools/i18n/tsconfig.json && npx tsc -p tools/racing/tsconfig.json

      - name: Build
        run: npm run build

  e2e:
    # in a real (headless) browser: every guide step plays on its own, and the main screens pass axe (WCAG 2.1 A / AA)
    # Pull requests always run this job; reusable-workflow callers can explicitly disable it.
    if: ${{ github.event_name == 'pull_request' || inputs.e2e == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the block catalogue
        run: node tools/build-catalog.mjs

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # WebGL uses software rendering on GitHub runners. Give each browser its own runner while distributing
      # the complete suite across shards; the tests and their timeouts remain unchanged.
      - name: Guide steps and accessibility
        run: npx playwright test --shard=${{ matrix.shard }}/4 --workers=1

      # Keep the warehouse angle captures on success too, so the terrain seam can be visually reviewed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  race-browser:
    # Focused racing/editor UI checks supplement the complete sharded browser suite on PRs.
    if: ${{ github.event_name == 'pull_request' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Racing, Welcome and accessibility
        run: npx playwright test e2e/racing.e2e.ts e2e/editor-regressions.e2e.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: race-browser-report
          path: playwright-report/
          retention-days: 7
